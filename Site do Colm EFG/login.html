<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar • Conecta Escola</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-wrapper">

    <div class="brand">
      <div class="brand-icon">🏫</div>
      Conecta Escola
    </div>

    <div class="card">

      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">
          Entrar
        </button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">
          Criar conta
        </button>
      </div>

      <div class="message" id="message"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <h2 class="form-title">Bem-vindo de volta </h2>
        <p class="form-subtitle">Entre para participar da comunidade.</p>

        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="loginEmail" placeholder="voce@escola.com" required />
        </div>

        <div class="form-group">
          <label>Senha</label>
          <div class="input-wrapper">
            <input type="password" id="loginPassword" placeholder="••••••••" required />
            <button type="button" class="toggle-eye"
                    onclick="togglePassword('loginPassword', this)"></button>
          </div>
        </div>

        <div class="row-between">
          <label><input type="checkbox" /> Lembrar de mim</label>
          <a href="#" class="link">Esqueci a senha</a>
        </div>

        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
      <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <h2 class="form-title">Criar conta</h2>
        <p class="form-subtitle">Junte-se à comunidade e proponha melhorias.</p>

        <div class="form-group">
          <label>Nome completo</label>
          <input type="text" id="regName" placeholder="Ana Silva" required />
        </div>

        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="regEmail" placeholder="voce@escola.com" required />
        </div>

        <div class="form-group">
          <label>Escola</label>
          <input type="text" id="regSchool"
                 placeholder="Escola Municipal Horizonte" required />
        </div>

        <div class="form-group">
          <label>Senha</label>
          <div class="input-wrapper">
            <input type="password" id="regPassword"
                   placeholder="Mínimo 6 caracteres" required minlength="6" />
            <button type="button" class="toggle-eye"
                    onclick="togglePassword('regPassword', this)">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label>Confirmar senha</label>
          <div class="input-wrapper">
            <input type="password" id="regConfirm"
                   placeholder="Repita a senha" required minlength="6" />
            <button type="button" class="toggle-eye"
                    onclick="togglePassword('regConfirm', this)">👁️</button>
          </div>
        </div>

        <div class="row-between">
          <label>
            <input type="checkbox" id="regTerms" required />
            Aceito os <a href="#" class="link">termos de uso</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Criar minha conta</button>
      </form>

      <div class="divider">ou continue com</div>

      <div class="social">
        <button type="button" onclick="socialLogin('Google')" title="Google"></button>
        <button type="button" onclick="socialLogin('Microsoft')" title="Microsoft"></button>
        <button type="button" onclick="socialLogin('GitHub')" title="GitHub"></button>
      </div>

    </div>

    <p class="footer-text">
      Ao entrar, você concorda com os <a href="#" class="link">Termos</a> e
      a <a href="#" class="link">Política de Privacidade</a>.
    </p>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
